<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Print Collection</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="6" fill="#6366f1"/>
        <path d="M14 4L24 9.5V18.5L14 24L4 18.5V9.5L14 4Z" stroke="white" stroke-width="2" fill="none"/>
        <path d="M14 4V24M4 9.5L24 9.5M4 18.5L24 18.5" stroke="white" stroke-width="1.5" opacity="0.5"/>
      </svg>
      <span class="logo-text">3D Print Collection</span>
    </div>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="collection">Collection</button>
      <button class="nav-btn" data-view="creators">Créateurs</button>
      <button class="nav-btn" data-view="stats">Statistiques</button>
    </nav>
    <div class="header-right">
      <button class="btn-icon" id="btn-export-pdf" title="Exporter PDF">📄</button>
      <button class="btn-icon" id="btn-import" title="Importer JSON">⬆</button>
      <button class="btn-icon" id="btn-export-json" title="Exporter JSON">⬇</button>
      <button class="btn-primary" id="btn-add">+ Ajouter</button>
    </div>
  </header>

  <main class="main">
    <section id="view-collection" class="view active">
      <div class="search-bar-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Rechercher par nom, créateur, tags..." />
      </div>

      <div class="filters-wrap">
        <div class="filters-toggle" id="filters-toggle">▼ Filtres</div>
        <div class="filters-panel" id="filters-panel">
          <div class="filter-group">
            <label>Statut</label>
            <div class="filter-chips" id="filter-status">
              <button class="chip active" data-value="">Tous</button>
              <button class="chip" data-value="owned">Possédé</button>
              <button class="chip" data-value="printing">En impression</button>
              <button class="chip" data-value="wishlist">Wishlist</button>
              <button class="chip" data-value="painted">Peint</button>
            </div>
          </div>
          <div class="filter-group">
            <label>Créateur</label>
            <select id="filter-creator" class="filter-select"><option value="">Tous</option></select>
          </div>
          <div class="filter-group">
            <label>Tags</label>
            <div class="filter-chips" id="filter-tags"></div>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <span id="count-label">0 sets</span>
        <div class="toolbar-right">
          <button class="view-btn active" id="view-grid">▦</button>
          <button class="view-btn" id="view-list">☰</button>
          <select id="sort-select" class="filter-select">
            <option value="name">Nom</option>
            <option value="creator">Créateur</option>
            <option value="date">Date</option>
            <option value="status">Statut</option>
          </select>
          <button class="btn-icon" id="sort-dir">↓</button>
        </div>
      </div>

      <div class="cards-grid" id="cards-container"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p>Aucun set trouvé</p>
        <button class="btn-primary" id="btn-add-empty">Ajouter votre premier set</button>
      </div>
    </section>

    <section id="view-creators" class="view">
      <div class="section-title">Créateurs</div>
      <div class="creators-grid" id="creators-container"></div>
    </section>

    <section id="view-stats" class="view">
      <div class="section-title">Statistiques</div>
      <div class="stats-grid" id="stats-container"></div>
    </section>
  </main>

  <!-- Modal Ajout/Édition -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Ajouter un set</h2>
        <button class="btn-icon" id="modal-close">✕</button>
      </div>
      <form class="modal-form" id="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label>Nom *</label>
            <input type="text" id="f-name" required placeholder="Dungeon Tiles Vol.1" />
          </div>
          <div class="form-group">
            <label>Créateur *</label>
            <input type="text" id="f-creator" required placeholder="Printable Scenery" list="creators-list" />
            <datalist id="creators-list"></datalist>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Plateforme</label>
            <input type="text" id="f-platform" placeholder="MyMiniFactory, Kickstarter..." />
          </div>
          <div class="form-group">
            <label>Statut</label>
            <select id="f-status">
              <option value="owned">Possédé</option>
              <option value="printing">En impression</option>
              <option value="wishlist">Wishlist</option>
              <option value="painted">Peint</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Prix (€)</label>
            <input type="number" id="f-price" placeholder="0.00" step="0.01" min="0" />
          </div>
          <div class="form-group">
            <label>Date d'acquisition</label>
            <input type="date" id="f-date" />
          </div>
        </div>
        <div class="form-group full">
          <label>Image</label>
          <div class="image-input-wrap">
            <input type="text" id="f-image-url" placeholder="URL de l'image..." />
            <span>ou</span>
            <label class="btn-secondary file-label">Fichier<input type="file" id="f-image-file" accept="image/*" style="display:none" /></label>
          </div>
          <div id="image-preview-wrap" style="display:none">
            <img id="image-preview" src="" alt="Preview" style="height:100px;border-radius:6px;margin-top:8px;" />
            <button type="button" id="remove-img" style="margin-left:8px;">✕</button>
          </div>
        </div>
        <div class="form-group full">
          <label>Tags (séparés par virgule)</label>
          <input type="text" id="f-tags" placeholder="donjon, fantasy, tiles" />
          <div class="tags-preview" id="tags-preview"></div>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea id="f-notes" rows="3" placeholder="Notes personnelles..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Lien (URL)</label>
            <input type="url" id="f-url" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Nombre de fichiers</label>
            <input type="number" id="f-files" placeholder="0" min="0" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn-primary">Sauvegarder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Détail -->
  <div class="modal-overlay" id="detail-overlay">
    <div class="modal modal-detail">
      <button class="btn-icon" id="detail-close" style="position:absolute;top:12px;right:12px;">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <input type="file" id="import-file" accept=".json" style="display:none" />
  <script src="app.js"></script>
</body>
</html>
